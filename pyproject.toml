[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "SeFA"
version = "0.0.1"
authors = [{name = "Atul Gupta", email = "atlgpt17@gmail.com"}]
readme = {file = "README.md", content-type = "text/markdown"}
license = { text = "MIT" }
# the parsers use nested-quote f-strings (PEP 701), which need 3.12
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "openpyxl",
    "yfinance",
    "requests",
]

[project.optional-dependencies]
test = [
    "pytest~=9.1",
]
# black is pinned exact: a release reformats source that did not change, which
# turns the check red on an unrelated pull request
lint = [
    "black==26.5.1",
    "pylint~=4.0.7",
]
typecheck = [
    "mypy~=2.3.0",
    "pandas-stubs==3.0.5.260730",
    "types-openpyxl==3.1.5.20260807",
    "types-requests==2.33.0.20260712",
]

[project.urls]
Repository = "https://github.com/atulgpt/SeFA.git"
Issues = "https://github.com/atulgpt/SeFA/issues"

[project.scripts]
sefa = "sefa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
sefa = ["py.typed"]

[tool.pytest]
pythonpath = ["src"]
testpaths = ["tests/unit"]
strict = true
minversion = "9.0"

[tool.mypy]
python_version = 3.12
mypy_path = ["src"]
files = ["src", "tests"]
# `tests` carries no `__init__.py`, so a `conftest.py` maps both to a top level
# `conftest` and to its path under `tests`. The repo root is the one package base
explicit_package_bases = true
strict = true

# An error the report can be fixed from, without opening the parser
pretty = true
show_error_codes = true

# yfinance ships no stubs and no py.typed marker
[[tool.mypy.overrides]]
module = ["yfinance.*"]
ignore_missing_imports = true

# A test is checked for the API it exercises, which is what catches a fixture built
# the wrong shape. Annotating every test function and fixture adds no such signal,
# and `check_untyped_defs` still reads the bodies
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pylint]
source-roots = ["src", "tests"]

# Disable specific messages
disable = [
    "missing-docstring", # Disable missing docstring warnings
    "missing-module-docstring",

    # black owns the layout, and it cannot split a long string. A sheet label or a
    # section A3 column heading is stated whole rather than wrapped
    "line-too-long",

    # a report is read with the source, the mode, the bounds and the output folder
    # in hand, and a filed row states every figure the schedule asks for
    "too-many-arguments",
    "too-many-positional-arguments",
    "too-many-locals",
    "too-many-instance-attributes",
    "too-few-public-methods",

    # the refresh scripts each state their own argparse block, which is the point
    "duplicate-code",

    "fixme",
]

# Set the maximum number of characters on a single line
max-line-length = 100

# Disable full report
reports = false
