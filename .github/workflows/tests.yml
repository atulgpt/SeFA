name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the minimum `requires-python` declares
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        # `-rs` names every skipped test, so one that skips because its
        # environment is not set up does not read as a pass
        run: python -m pytest -q -rs

  types:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # the version mypy.ini declares, so CI and a local run agree
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # the type check reads `tests` too, so it needs what the tests import
          python -m pip install -e ".[test,typecheck]"

      - name: Type check
        run: python -m mypy

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # pylint resolves the imports of what it reads, so it needs the project
          # installed and what the tests import
          python -m pip install -e ".[test,lint]"

      - name: Format
        run: python -m black --check --diff .

      - name: Lint
        run: >
          python -m pylint src tests
