[mypy]
python_version = 3.12
files = aggregator, models, parser, utils, run.py, tests

# `tests` carries no `__init__.py`, so a `conftest.py` maps both to a top level
# `conftest` and to its path under `tests`. The repo root is the one package base
explicit_package_bases = True
mypy_path = .

strict = True

# An error the report can be fixed from, without opening the parser
pretty = True
show_error_codes = True

# yfinance ships no stubs and no py.typed marker
[mypy-yfinance.*]
ignore_missing_imports = True

# A test is checked for the API it exercises, which is what catches a fixture built
# the wrong shape. Annotating every test function and fixture adds no such signal,
# and `check_untyped_defs` still reads the bodies
[mypy-tests.*]
disallow_untyped_defs = False
disallow_incomplete_defs = False
